[package]
name = "mongor"
version = "0.1.0"
edition = "2024"
description = "A standalone MongoDB migration CLI, inspired by Flyway and Goose."
license = "MIT OR Apache-2.0"
repository = "https://github.com/aleksandarskrbic/mongor"
homepage = "https://github.com/aleksandarskrbic/mongor"
readme = "README.md"
keywords = ["mongodb", "migration", "database", "cli", "mongosh"]
categories = ["command-line-utilities", "database"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
mongodb = "3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

